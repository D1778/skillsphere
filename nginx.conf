server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache hashed build assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: react-router (BrowserRouter) needs every unknown path
    # to resolve to index.html, otherwise a hard refresh on /jobs or
    # /dashboard/anything returns Nginx's own 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
